<!doctype html>
<!-- Modèle de l'image d'aperçu (1200x630) -> assets/og-image-v2.png. Capture : voir GUIDE.md.
     Si on la change : NOUVEAU nom (og-image-v3.png) car WhatsApp/Facebook gardent l'ancienne. -->
<html translate="no" lang="fr"><head><meta charset="utf-8">
<meta name="google" content="notranslate">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;800&family=Noto+Kufi+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Figtree,sans-serif;color:#fff;position:relative;background:#174A84}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.voile{position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,74,132,.96) 0%,rgba(23,74,132,.88) 46%,rgba(23,74,132,.15) 75%,rgba(23,74,132,0) 100%)}
.contenu{position:absolute;left:70px;top:64px;width:620px}
.marque{display:flex;align-items:center;gap:16px;font-size:28px;font-weight:800;margin-bottom:36px}
.marque img{width:64px;height:64px}
h1{font-size:64px;line-height:1.05;margin:0 0 18px;letter-spacing:-.02em}
.ar{font-family:"Noto Kufi Arabic",sans-serif;font-size:36px;font-weight:700;direction:rtl;text-align:left;margin:0 0 30px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:9px 20px;font-size:22px;font-weight:600}
.pill.o{background:#E8731A}
.permis{position:absolute;right:60px;bottom:40px;width:420px;transform:rotate(-7deg);filter:drop-shadow(0 18px 22px rgba(0,0,0,.45))}
.credit{position:absolute;right:14px;top:10px;font-size:13px;opacity:.85;text-shadow:0 1px 2px #000}
</style></head>
<body>
<img class="photo" src="../assets/photos/accueil-route.webp" alt="">
<div class="voile"></div>
<div class="contenu">
  <div class="marque"><img src="../assets/logo.svg" alt="">Code de la route Tunisie</div>
  <h1>Leçons, panneaux, examen blanc, amendes</h1>
  <p class="ar">راجع قانون الطرقات مجانًا</p>
  <div class="pills"><span class="pill o">Gratuit</span><span class="pill">Français · العربية</span><span class="pill">Article de loi cité</span></div>
</div>
<img class="permis" src="../assets/illustrations/permis-specimen.svg" alt="">
<div class="credit">Photo : Jorge Franganillo, CC BY 2.0 (Wikimedia Commons) — carte : dessin SPÉCIMEN</div>
</body></html>
