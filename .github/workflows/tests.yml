# Robot « Tests » : à chaque envoi sur GitHub, lance le test automatique du site.
# S'il échoue, il ouvre (ou complète) une issue GitHub pour prévenir Ahmed.
name: tests

# Audit des robots du 10/10/2026 : pas de tests pour un envoi qui ne change que des notes (.md) ; un nouvel envoi annule le précédent.
on:
  push:
    branches: [main, "entretien-tests/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer jsdom (sans fichier package)
        run: npm install --no-save --no-package-lock jsdom
      - name: Test du site
        run: node tools/test_site.mjs
      - name: Test du service worker (installation sur le telephone)
        run: node tools/test_sw.mjs
      - name: Test de la vidéo de présentation et du bouton Partager
        run: node tools/test_video.mjs
      - name: Test de la section Votre avis (envoi Formspree simule)
        run: node tools/test_avis.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Visiteur simule
        # Règle générale du 18/10/2026 : le visiteur simulé signale les problèmes AVANT le visiteur réel (tools/visiteur_simule.py, outil commun).
        # Seule exception tolérée : « /video/ : page non chargée » = faux positif connu de l'outil (la vidéo retarde l'événement
        # « load » dans Chrome sans écran ; aucun effet pour un vrai visiteur). Toute autre anomalie rend le robot rouge.
        run: |
          code=0; python tools/visiteur_simule.py > visiteur.txt || code=$?
          cat visiteur.txt
          grep -q '^ANOMALIES' visiteur.txt || exit 1
          autres=$(grep '^  - ' visiteur.txt | grep -cv '^  - /video/ : page non chargée$' || true)
          if [ "$code" != 0 ] && [ "$autres" != 0 ]; then exit 1; fi
      - name: Prévenir par une issue si le test échoue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITRE="Le test automatique du site a échoué"
          LIEN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CORPS="Le test tools/test_site.mjs, tools/test_sw.mjs, tools/test_avis.mjs ou le visiteur simulé (tools/visiteur_simule.py) a échoué après l'envoi ${{ github.sha }}. Journal : $LIEN — ne pas laisser le site dans cet état : corriger puis relancer le test."
          NUM=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$CORPS"
          else
            gh issue create --title "$TITRE" --body "$CORPS"
          fi
