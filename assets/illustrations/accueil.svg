<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="Route avec voiture, feu tricolore et panneaux">
  <!-- soleil et nuages -->
  <circle cx="560" cy="42" r="22" fill="#FFC27A" opacity=".9"/>
  <g fill="#fff" opacity=".18"><rect x="70" y="28" width="96" height="22" rx="11"/><rect x="96" y="16" width="52" height="24" rx="12"/><rect x="380" y="46" width="80" height="18" rx="9"/></g>
  <!-- collines -->
  <path d="M0 132c70-34 140-40 220-22s150 14 230-10 140-20 190 6v34H0z" fill="#fff" opacity=".08"/>
  <!-- palmier -->
  <g transform="translate(600 76)"><path d="M2 70c2-24 0-46-6-66" stroke="#0E2238" stroke-opacity=".45" stroke-width="5" fill="none" stroke-linecap="round"/>
