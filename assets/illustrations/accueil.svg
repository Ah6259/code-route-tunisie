    <rect x="160" y="30" width="20" height="6" rx="3" fill="#FFC27A"/>
    <rect x="12" y="30" width="12" height="6" rx="3" fill="#F0705F"/>
    <rect x="100" y="28" width="12" height="3" rx="1.5" fill="#0E2238" opacity=".3"/>
    <g fill="#0E2238"><circle cx="50" cy="46" r="13"/><circle cx="148" cy="46" r="13"/></g>
    <g fill="#DCE6F2"><circle cx="50" cy="46" r="5.5"/><circle cx="148" cy="46" r="5.5"/></g>
  </g>
  <!-- feu tricolore -->
  <g transform="translate(500 40)"><rect x="-3" y="70" width="6" height="64" rx="2" fill="#DCE6F2"/>
    <rect x="-17" y="0" width="34" height="76" rx="9" fill="#0E2238"/>
    <circle cx="0" cy="15" r="9" fill="#C2382B" opacity=".35"/><circle cx="0" cy="38" r="9" fill="#E8731A" opacity=".35"/><circle cx="0" cy="61" r="9" fill="#3CC47F"/>
    <circle cx="0" cy="61" r="14" fill="#3CC47F" opacity=".25"/></g>
