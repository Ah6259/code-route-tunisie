  <!-- route -->
  <rect x="0" y="140" width="640" height="38" fill="#0E2238" opacity=".55"/>
  <rect x="0" y="140" width="640" height="3" fill="#fff" opacity=".5"/>
  <rect x="0" y="175" width="640" height="3" fill="#fff" opacity=".5"/>
  <g fill="#fff" opacity=".85"><rect x="10" y="158" width="34" height="3" rx="1.5"/><rect x="74" y="158" width="34" height="3" rx="1.5"/><rect x="138" y="158" width="34" height="3" rx="1.5"/><rect x="202" y="158" width="34" height="3" rx="1.5"/><rect x="266" y="158" width="34" height="3" rx="1.5"/><rect x="330" y="158" width="34" height="3" rx="1.5"/><rect x="394" y="158" width="34" height="3" rx="1.5"/><rect x="458" y="158" width="34" height="3" rx="1.5"/><rect x="522" y="158" width="34" height="3" rx="1.5"/><rect x="586" y="158" width="34" height="3" rx="1.5"/></g>
  <!-- panneau de danger (triangle) -->
  <g transform="translate(58 70)"><rect x="-2.5" y="30" width="5" height="40" rx="2" fill="#DCE6F2"/>
    <path d="M0 0l26 44H-26z" fill="#fff" stroke="#C2382B" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 14v14" stroke="#0E2238" stroke-width="4.5" stroke-linecap="round"/><circle cx="0" cy="35" r="2.6" fill="#0E2238"/></g>
  <!-- panneau STOP -->
  <g transform="translate(150 78)"><rect x="-2.5" y="22" width="5" height="40" rx="2" fill="#DCE6F2"/>
    <path d="M-9-22h18l13 13v18L9 22H-9L-22 9V-9z" fill="#C2382B" stroke="#fff" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" fill="#fff">STOP</text></g>
  <!-- voiture -->
  <g transform="translate(250 115)">
    <path d="M10 40c0-10 4-16 14-18l22-4 22-18h58l26 20 22 4c8 2 12 8 12 16v6H10z" fill="#fff"/>
